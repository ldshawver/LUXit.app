{# Floating "Feedback" button + submit modal — included from base.html for
   authenticated users only. Pure Bootstrap 5; vanilla JS. #}
{% if current_user.is_authenticated %}
<button id="feedbackFab" type="button" class="btn"
        title="Send feedback"
        data-bs-toggle="modal" data-bs-target="#feedbackModal"
        style="position:fixed;right:18px;bottom:18px;z-index:1040;
               background:linear-gradient(135deg,var(--lux-primary,#bc00ed),var(--lux-secondary,#00ffb4));
               color:#fff;border:none;border-radius:999px;padding:10px 16px;
               font-weight:600;font-size:0.85rem;
               box-shadow:0 6px 20px rgba(0,0,0,0.4),0 0 0 1px rgba(255,255,255,0.08);">
  <i data-feather="message-circle" style="width:14px;height:14px;vertical-align:-2px;"></i>
  Feedback
</button>

<div class="modal fade" id="feedbackModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content"
         style="background:var(--lux-modal-bg,#16113a);border:1px solid var(--lux-modal-border,rgba(255,255,255,0.1));">
      <div class="modal-header" style="border-bottom:1px solid rgba(255,255,255,0.07);">
        <h5 class="modal-title">Send feedback</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="feedbackForm" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label small text-uppercase text-muted mb-1">Type</label>
            <select name="ticket_type" class="form-select form-select-sm" required>
              <option value="bug">Bug Report</option>
              <option value="ux_issue">UX Issue</option>
              <option value="feature_request">Feature Request</option>
              <option value="general" selected>General Feedback</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label small text-uppercase text-muted mb-1">Severity</label>
            <select name="severity" class="form-select form-select-sm">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
              <option value="critical">Critical</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label small text-uppercase text-muted mb-1">Title</label>
            <input type="text" name="title" class="form-control form-control-sm"
                   placeholder="One-line summary" maxlength="200" required>
          </div>
          <div class="mb-3">
            <label class="form-label small text-uppercase text-muted mb-1">Description</label>
            <textarea name="description" class="form-control form-control-sm" rows="5"
                      placeholder="What happened? What did you expect?" required></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label small text-uppercase text-muted mb-1">Screenshot (optional)</label>
            <input type="file" name="screenshot" class="form-control form-control-sm"
                   accept="image/png,image/jpeg,image/gif,image/webp">
            <div class="form-text small">Max 5 MB. PNG, JPG, GIF or WebP.</div>
          </div>
          <input type="hidden" name="page_url" id="feedbackPageUrl">
          <div id="feedbackStatus" class="small mt-2"></div>
        </form>
      </div>
      <div class="modal-footer" style="border-top:1px solid rgba(255,255,255,0.07);">
        <a href="{{ url_for('feedback.my_tickets') }}"
           class="btn btn-sm btn-outline-secondary me-auto">My submissions</a>
        <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-sm btn-primary" id="feedbackSubmitBtn">Submit</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  var modal = document.getElementById('feedbackModal');
  if (!modal) return;
  modal.addEventListener('show.bs.modal', function() {
    var url = document.getElementById('feedbackPageUrl');
    if (url) url.value = window.location.pathname + window.location.search;
    var status = document.getElementById('feedbackStatus');
    if (status) status.textContent = '';
  });
  var btn = document.getElementById('feedbackSubmitBtn');
  if (!btn) return;
  btn.addEventListener('click', function() {
    var form = document.getElementById('feedbackForm');
    if (!form.reportValidity()) return;
    var status = document.getElementById('feedbackStatus');
    btn.disabled = true;
    status.style.color = '';
    status.textContent = 'Sending…';
    var token = (document.querySelector('meta[name="csrf-token"]') || {}).content || '';
    fetch('{{ url_for("feedback.submit_ticket") }}', {
      method: 'POST',
      headers: {'X-CSRFToken': token},
      body: new FormData(form),
    }).then(function(r) { return r.json().then(function(j) { return {ok: r.ok, body: j}; }); })
      .then(function(res) {
        if (res.ok) {
          status.style.color = '#00ffb4';
          status.textContent = 'Thanks — submitted!';
          form.reset();
          setTimeout(function() {
            var inst = bootstrap.Modal.getInstance(modal);
            if (inst) inst.hide();
          }, 800);
        } else {
          status.style.color = '#ff6b9c';
          status.textContent = (res.body && res.body.error) || 'Submission failed.';
        }
      })
      .catch(function() {
        status.style.color = '#ff6b9c';
        status.textContent = 'Network error — please retry.';
      })
      .finally(function() { btn.disabled = false; });
  });
})();
</script>
{% endif %}
