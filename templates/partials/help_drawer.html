<div id="lux-help-drawer" class="lux-help-drawer">
  <div class="lux-help-drawer-backdrop" onclick="LuxHelp.closeDrawer()"></div>
  <div class="lux-help-drawer-panel">
    <div class="lux-help-drawer-header">
      <div class="lux-help-drawer-title-row">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <h3 id="help-drawer-title">Help</h3>
      </div>
      <button class="lux-help-close" onclick="LuxHelp.closeDrawer()">&times;</button>
    </div>

    <div class="lux-help-drawer-body" id="help-drawer-body">
      <div id="help-loading" class="lux-help-loading">
        <div class="lux-help-spinner"></div>
        <p>Loading help content...</p>
      </div>

      <div id="help-content-section" style="display:none;">
        <div id="help-instructions" class="lux-help-section"></div>

        <div id="help-video-section" class="lux-help-section" style="display:none;">
          <h4><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg> Video Guide</h4>
          <div id="help-video-embed" class="lux-help-video"></div>
        </div>

        <div id="help-pdf-section" class="lux-help-section" style="display:none;">
          <h4><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> Documentation</h4>
          <a id="help-pdf-link" href="#" target="_blank" class="lux-help-pdf-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download PDF
          </a>
        </div>

        <div id="help-walkthroughs-section" class="lux-help-section" style="display:none;">
          <h4><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg> Interactive Walkthroughs</h4>
          <div id="help-walkthroughs-list"></div>
        </div>
      </div>

      <div id="help-empty" class="lux-help-empty" style="display:none;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(168,85,247,0.3)" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <p>No help content available for this screen yet.</p>
      </div>
    </div>

    <div class="lux-help-drawer-footer">
      <button onclick="LuxHelp.shareHelp()" class="lux-help-footer-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        Share
      </button>
      <button onclick="LuxHelp.printHelp()" class="lux-help-footer-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Print
      </button>
    </div>
  </div>
</div>
