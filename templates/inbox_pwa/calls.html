<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>LUXit Calls</title>
  <script src="https://sdk.twilio.com/js/voice/releases/2.12.3/twilio.min.js" defer></script>
  <style>
    :root{--bg:#060712;--card:#111827;--border:#273044;--text:#f8fafc;--muted:#94a3b8;--purple:#7c3aed;--green:#22c55e;--red:#ef4444;--amber:#f59e0b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#111827,#050816);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.shell{max-width:560px;margin:0 auto;min-height:100vh;padding:18px 14px 96px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.top h1{font-size:1.5rem;margin:0}.icon{width:38px;height:38px;border-radius:13px;border:1px solid var(--border);background:#0f172a;color:#fff;display:grid;place-items:center;text-decoration:none}.voice-state{font-size:.76rem;color:var(--muted);text-align:center;margin-top:-7px;margin-bottom:10px}.tabs{display:flex;gap:8px;overflow:auto;padding:8px 0 12px}.tab{border:1px solid var(--border);background:#0f172a;color:var(--muted);border-radius:999px;padding:8px 12px;white-space:nowrap}.tab.active{background:rgba(124,58,237,.22);color:#ddd6fe;border-color:var(--purple)}.card{background:rgba(17,24,39,.92);border:1px solid var(--border);border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 18px 50px rgba(0,0,0,.25)}.row{display:flex;gap:12px;align-items:flex-start}.avatar{width:42px;height:42px;border-radius:15px;background:#1f2937;display:grid;place-items:center;font-size:1.1rem}.meta{flex:1;min-width:0}.name{font-weight:700}.num,.small{color:var(--muted);font-size:.84rem}.badge{font-size:.72rem;border-radius:999px;padding:3px 8px;background:#1f2937;color:#cbd5e1}.badge.missed,.badge.declined{background:rgba(239,68,68,.16);color:#fecaca}.badge.voicemail{background:rgba(245,158,11,.16);color:#fde68a}.badge.forwarded{background:rgba(124,58,237,.22);color:#ddd6fe}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:11px;background:#1f2937;color:#e5e7eb;padding:8px 10px;text-decoration:none;font-size:.82rem}.btn.primary{background:var(--purple);color:#fff}.btn.warn{background:#78350f}.transcript{margin-top:9px;color:#cbd5e1;font-size:.86rem;line-height:1.35;background:#0b1020;border-radius:12px;padding:9px}.incoming{position:fixed;inset:auto 12px 86px;max-width:520px;margin:auto;background:#111827;border:1px solid #334155;border-radius:24px;padding:18px;box-shadow:0 24px 80px rgba(0,0,0,.55);display:none;z-index:20}.incoming.show{display:block}.call-controls{display:flex;justify-content:space-around;margin-top:18px}.round{width:58px;height:58px;border-radius:999px;border:0;color:#fff;font-size:1.1rem}.accept{background:var(--green)}.decline{background:var(--red)}.vm,.mute{background:#334155}.settings{display:none}.settings.show{display:block}.field{margin:12px 0}.field label{display:block;color:#cbd5e1;font-size:.85rem;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;background:#020617;border:1px solid var(--border);color:#fff;border-radius:11px;padding:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(2,6,23,.92);backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:10px;display:flex;justify-content:center;gap:18px}.nav{color:var(--muted);text-decoration:none;font-size:.8rem;text-align:center}.nav.active{color:#ddd6fe}.empty{text-align:center;color:var(--muted);padding:45px 20px}.error{color:#fecaca}.ok{color:#bbf7d0}
  </style>
</head>
<body>
<div class="shell">
  <div class="top"><a class="icon" href="/app/inbox">‹</a><h1>Calls</h1><button class="icon" onclick="toggleSettings()">⚙</button></div>
  <div id="voiceState" class="voice-state">Initializing browser phone…</div>
  <div id="settings" class="settings card">
    <h2 style="margin-top:0">Phone Settings</h2>
    <div class="grid"><div class="field"><label>During hours route</label><select id="during_hours_route"><option value="ring_pwa">Ring PWA</option><option value="forward">Forward</option><option value="voicemail">Voicemail</option></select></div><div class="field"><label>After hours route</label><select id="after_hours_route"><option value="voicemail">Voicemail</option><option value="forward">Forward</option><option value="ring_pwa">Ring PWA</option></select></div></div>
    <div class="field"><label>Timezone</label><input id="timezone" placeholder="America/New_York"></div>
    <div class="grid"><div class="field"><label>Forward number</label><input id="forward_number"></div><div class="field"><label>After-hours forward</label><input id="after_hours_forward_number"></div></div>
    <div class="field"><label>Business-hours voicemail greeting</label><textarea id="voicemail_greeting"></textarea></div><div class="field"><label>After-hours voicemail greeting</label><textarea id="after_hours_voicemail_greeting"></textarea></div>
    <div class="grid"><label><input type="checkbox" id="missed_call_sms_enabled"> Missed SMS</label><label><input type="checkbox" id="after_hours_sms_enabled"> After-hours SMS</label><label><input type="checkbox" id="recording_enabled"> Record calls</label><label><input type="checkbox" id="transcription_enabled"> Transcribe VM</label></div>
    <div class="field"><label>Missed-call SMS body</label><textarea id="missed_call_sms_body"></textarea></div><div class="field"><label>After-hours SMS body</label><textarea id="after_hours_sms_body"></textarea></div><button class="btn primary" onclick="saveSettings()">Save settings</button>
  </div>
  <div class="tabs" id="tabs"><button class="tab active" data-tab="all">All</button><button class="tab" data-tab="missed">Missed</button><button class="tab" data-tab="voicemail">Voicemail</button><button class="tab" data-tab="recordings">Recordings</button><button class="tab" data-tab="forwarded">Forwarded</button></div><div id="list"></div>
</div>
<div id="incoming" class="incoming"><div class="small" id="incomingMode">Incoming call</div><h2 id="incomingName">Unknown caller</h2><div class="num" id="incomingNumber"></div><div class="call-controls"><button class="round accept" onclick="acceptIncoming()">☎</button><button class="round mute" onclick="toggleMute()">M</button><button class="round vm" onclick="sendIncomingToVoicemail()">VM</button><button class="round decline" onclick="declineIncoming()">✕</button></div></div>
<div class="bottom"><a class="nav" href="/app/inbox">Messages</a><a class="nav active" href="/app/calls">Calls</a><a class="nav" href="/app/calls/settings" onclick="setTimeout(toggleSettings,0)">Settings</a></div>
<script>
let active='all', voiceDevice=null, pendingCall=null, activeCall=null, pendingCallLogId=null, muted=false;
const qs=(id)=>document.getElementById(id);function state(msg,cls=''){voiceState.textContent=msg;voiceState.className='voice-state '+cls}function fmtDur(s){s=Number(s||0);return s?`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`:'—'}function icon(c){if(c.status==='missed'||c.status==='no-answer'||c.status==='declined')return'↙';if(c.status==='voicemail')return'🎙';if(c.status==='forwarded'||c.forwarded_to_number)return'↪';return c.direction==='outbound'?'↗':'↘'}
function callIdFromInvite(call){try{return call?.customParameters?.get('call_log_id')||call?.parameters?.call_log_id||pendingCallLogId}catch(e){return pendingCallLogId}}
function render(calls){list.innerHTML=calls.length?'':'<div class="empty">No calls yet.</div>';calls.forEach(c=>{let b=(c.status||'').replace('no-answer','missed');let el=document.createElement('div');el.className='card';el.innerHTML=`<div class="row"><div class="avatar">${icon(c)}</div><div class="meta"><div class="name">${c.caller_name||c.from_number||'Unknown'}</div><div class="num">${c.from_number||''} → ${c.to_number||''}</div><div class="small">${new Date(c.created_at).toLocaleString()} · ${fmtDur(c.duration_seconds)} ${c.forwarded_to_number?'· fwd '+c.forwarded_to_number:''}${c.answered_by_user_id?' · answered by user '+c.answered_by_user_id:''}</div></div><span class="badge ${b}">${b||'ringing'}</span></div>${c.transcription_text?`<div class="transcript">${c.transcription_text.slice(0,180)}</div>`:''}<div class="actions"><a class="btn primary" href="tel:${c.from_number||''}">Call back</a><a class="btn" href="sms:${c.from_number||''}">Message</a>${c.voicemail_url?`<a class="btn" href="${c.voicemail_url}" target="_blank">Voicemail</a>`:''}${c.recording_url?`<a class="btn" href="${c.recording_url}" target="_blank">Recording</a>`:''}<button class="btn" onclick="archiveCall(${c.id})">Archive</button></div>`;list.appendChild(el)})}
async function load(){let r=await fetch('/api/calls/recent?tab='+active);render((await r.json()).calls||[])}tabs.onclick=e=>{if(e.target.dataset.tab){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));e.target.classList.add('active');active=e.target.dataset.tab;load()}};async function archiveCall(id){await fetch(`/api/calls/${id}/archive`,{method:'POST'});load()}function toggleSettings(){settings.classList.toggle('show')}
async function loadSettings(){let s=(await(await fetch('/api/phone/settings')).json()).settings||{};Object.keys(s).forEach(k=>{let el=qs(k);if(!el)return;if(el.type==='checkbox')el.checked=!!s[k];else el.value=s[k]||''})}async function saveSettings(){let data={};document.querySelectorAll('#settings input,#settings textarea,#settings select').forEach(el=>data[el.id]=el.type==='checkbox'?el.checked:el.value);await fetch('/api/phone/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});alert('Saved')}
function showIncoming(d,call=null){pendingCall=call||pendingCall;pendingCallLogId=d.call_id||callIdFromInvite(call);incomingMode.textContent=call?'Incoming browser call':'Incoming call';incomingName.textContent=d.caller_name||d.from_number||'Unknown caller';incomingNumber.textContent=d.from_number||'';incoming.classList.add('show');load()}function hideIncoming(){incoming.classList.remove('show')}async function markCall(action){let id=callIdFromInvite(pendingCall||activeCall);if(id)await fetch(`/api/calls/${id}/${action}`,{method:'POST'}).catch(()=>{});load()}
async function acceptIncoming(){try{if(pendingCall){activeCall=pendingCall;await pendingCall.accept();pendingCall=null;await markCall('accept');state('Call connected','ok')}hideIncoming()}catch(e){state('Could not answer: '+e.message,'error')}}async function declineIncoming(){try{if(pendingCall){pendingCall.reject();await markCall('decline')}else await markCall('decline')}finally{pendingCall=null;hideIncoming();state('Call declined')}}async function sendIncomingToVoicemail(){try{if(pendingCall)pendingCall.reject();await markCall('voicemail')}finally{pendingCall=null;hideIncoming();state('Sent to voicemail')}}async function endCall(){if(activeCall){activeCall.disconnect();await markCall('end');activeCall=null;state('Call ended')}}function toggleMute(){muted=!muted;if(activeCall&&activeCall.mute)activeCall.mute(muted);state(muted?'Muted':'Unmuted')}
async function initVoice(){try{if(!window.Twilio||!Twilio.Device){state('Twilio Voice SDK unavailable','error');return}let res=await fetch('/api/phone/voice-token');let body=await res.json();if(!body.success){state(body.error||'Voice token unavailable','error');return}voiceDevice=new Twilio.Device(body.token,{logLevel:1,codecPreferences:['opus','pcmu']});voiceDevice.on('registered',()=>state('Browser phone ready as '+body.identity,'ok'));voiceDevice.on('error',e=>state('Voice device error: '+e.message,'error'));voiceDevice.on('incoming',call=>{let params=call.customParameters;showIncoming({call_id:params?.get('call_log_id'),from_number:params?.get('from_number'),caller_name:params?.get('caller_name')},call)});voiceDevice.on('tokenWillExpire',initVoice);await voiceDevice.register()}catch(e){state('Voice setup failed: '+e.message,'error')}}window.addEventListener('beforeunload',()=>{try{voiceDevice?.unregister()}catch(e){}});
try{let es=new EventSource('/api/inbox/stream');es.onmessage=e=>{let d=JSON.parse(e.data);if(d.type==='incoming_call')showIncoming(d)}}catch(e){}window.addEventListener('load',()=>setTimeout(initVoice,200));load();loadSettings();if(location.pathname.endsWith('/settings'))settings.classList.add('show');
</script>
</body>
</html>
