<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>LUXit Calls</title>
  <script src="https://sdk.twilio.com/js/voice/releases/2.12.3/twilio.min.js" defer></script>
  <style>
    :root{--pwa-bg:#060712;--pwa-surface:var(--color-surface,#111827);--pwa-card-bg:var(--pwa-surface);--pwa-surface-2:#0f172a;--pwa-border:var(--color-border,#273044);--pwa-text:var(--color-text,#f8fafc);--pwa-muted:var(--color-muted-text,#94a3b8);--pwa-primary:var(--color-primary,var(--pwa-primary));--pwa-primary-contrast:#fff;--pwa-accent:var(--color-accent,#ec4899);--pwa-primary-soft:color-mix(in srgb,var(--pwa-primary) 22%,transparent);--pwa-success:#22c55e;--pwa-danger:#ef4444;--pwa-warning:#f59e0b;--pwa-card-radius:20px;--pwa-shadow:0 18px 50px rgba(0,0,0,.25)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--pwa-surface),var(--pwa-bg));color:var(--pwa-text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.shell{max-width:560px;margin:0 auto;min-height:100vh;padding:18px max(18px,env(safe-area-inset-left)) calc(112px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-right))}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.top h1{font-size:1.5rem;margin:0}.icon{width:38px;height:38px;border-radius:13px;border:1px solid var(--pwa-border);background:var(--pwa-surface-2);color:var(--pwa-text);display:grid;place-items:center;text-decoration:none}.voice-state{font-size:.76rem;color:var(--pwa-muted);text-align:center;margin-top:-7px;margin-bottom:10px}.tabs{display:flex;gap:8px;overflow:auto;padding:8px 0 12px}.tab{border:1px solid var(--pwa-border);background:var(--pwa-surface-2);color:var(--pwa-muted);border-radius:999px;padding:8px 12px;white-space:nowrap}.tab.active{background:var(--pwa-primary-soft);color:var(--pwa-text);border-color:var(--pwa-primary)}.card,.pwa-card{background:color-mix(in srgb,var(--pwa-card-bg) 92%,transparent);border:1px solid var(--pwa-border);border-radius:var(--pwa-card-radius);padding:14px;margin:10px 0;box-shadow:var(--pwa-shadow)}.row{display:flex;gap:12px;align-items:flex-start}.avatar{width:42px;height:42px;border-radius:15px;background:var(--pwa-primary-soft);display:grid;place-items:center;font-size:1.1rem}.meta{flex:1;min-width:0}.name{font-weight:700}.num,.small{color:var(--pwa-muted);font-size:.84rem}.badge{font-size:.72rem;border-radius:999px;padding:3px 8px;background:var(--pwa-primary-soft);color:var(--pwa-text)}.badge.missed,.badge.declined{background:color-mix(in srgb,var(--pwa-danger) 22%,transparent);color:color-mix(in srgb,var(--pwa-danger) 25%,var(--pwa-primary-contrast))}.badge.voicemail{background:color-mix(in srgb,var(--pwa-warning) 22%,transparent);color:color-mix(in srgb,var(--pwa-warning) 35%,var(--pwa-primary-contrast))}.badge.forwarded{background:var(--pwa-primary-soft);color:var(--pwa-text)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid var(--pwa-border);border-radius:11px;background:var(--pwa-surface-2);color:var(--pwa-text);padding:8px 10px;text-decoration:none;font-size:.82rem}.btn.primary{background:var(--pwa-primary);border-color:var(--pwa-primary);color:var(--pwa-primary-contrast)}.btn.warn{background:color-mix(in srgb,var(--pwa-warning) 28%,var(--pwa-surface-2))}.voicemail-player{width:100%;margin-top:8px;accent-color:var(--pwa-primary)}.transcript{margin-top:9px;color:var(--pwa-text);font-size:.86rem;line-height:1.35;background:var(--pwa-surface-2);border-radius:12px;padding:9px}.incoming{position:fixed;inset:auto 12px 86px;max-width:520px;margin:auto;background:var(--pwa-surface);border:1px solid var(--pwa-border);border-radius:24px;padding:18px;box-shadow:0 24px 80px rgba(0,0,0,.55);display:none;z-index:20}.incoming.show{display:block}.call-controls{display:flex;justify-content:space-around;margin-top:18px}.round{width:58px;height:58px;border-radius:999px;border:0;color:var(--pwa-primary-contrast);font-size:1.1rem}.accept{background:var(--pwa-success)}.decline{background:var(--pwa-danger)}.vm,.mute{background:var(--pwa-primary)}.settings{display:none}.settings.show{display:block}.field{margin:12px 0}.field label{display:block;color:var(--pwa-text);font-size:.85rem;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;background:var(--pwa-surface-2);border:1px solid var(--pwa-border);color:var(--pwa-text);border-radius:11px;padding:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bottom{position:fixed;left:max(18px,env(safe-area-inset-left));right:max(18px,env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));border-radius:26px;background:color-mix(in srgb,var(--pwa-bg) 92%,transparent);backdrop-filter:blur(14px);border:1px solid var(--pwa-border);padding:10px 14px;display:flex;justify-content:space-around;gap:10px}.nav{min-width:44px;min-width:50px;min-height:44px;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:16px;color:var(--pwa-muted);text-decoration:none;font-size:1.45rem;text-align:center;transition:background .15s,color .15s}.nav span{font-size:.64rem;line-height:1;max-height:0;opacity:0;overflow:hidden;transition:max-height .15s,opacity .15s;margin-top:0}.nav:hover span,.nav:focus-visible span,.nav.active span{max-height:1rem;opacity:1;margin-top:2px}.nav:hover,.nav:focus-visible{background:var(--pwa-primary-soft);color:var(--pwa-text);outline:none}.nav.active{background:var(--pwa-primary-soft);color:var(--pwa-primary-contrast)}.empty{text-align:center;color:var(--pwa-muted);padding:45px 20px}.error{color:color-mix(in srgb,var(--pwa-danger) 30%,var(--pwa-primary-contrast))}.ok{color:color-mix(in srgb,var(--pwa-success) 30%,var(--pwa-primary-contrast))}
  </style>
</head>
<body>
<div class="shell">
  <div class="top"><a class="icon" href="/app/inbox">‹</a><h1>Recents</h1><button class="icon" onclick="toggleSettings()">⚙</button></div>
  <div id="voiceState" class="voice-state">Initializing browser phone…</div>
  <div id="settings" class="settings card">
    <h2 style="margin-top:0">Phone Settings</h2>
    <div class="grid"><div class="field"><label>During hours route</label><select id="during_hours_route"><option value="ring_pwa">Ring PWA</option><option value="forward">Forward</option><option value="voicemail">Voicemail</option></select></div><div class="field"><label>After hours route</label><select id="after_hours_route"><option value="voicemail">Voicemail</option><option value="forward">Forward</option><option value="ring_pwa">Ring PWA</option></select></div></div>
    <div class="field"><label>Timezone</label><input id="timezone" placeholder="America/New_York"></div>
    <div class="grid"><div class="field"><label>Forward number</label><input id="forward_number"></div><div class="field"><label>After-hours forward</label><input id="after_hours_forward_number"></div></div>
    <div class="field"><label>Business-hours voicemail greeting</label><textarea id="voicemail_greeting"></textarea></div><div class="field"><label>After-hours voicemail greeting</label><textarea id="after_hours_voicemail_greeting"></textarea></div>
    <div class="grid"><label><input type="checkbox" id="missed_call_sms_enabled"> Missed SMS</label><label><input type="checkbox" id="after_hours_sms_enabled"> After-hours SMS</label><label><input type="checkbox" id="recording_enabled"> Record calls</label><label><input type="checkbox" id="transcription_enabled"> Transcribe Voicemail</label></div>
    <div class="field"><label>Missed-call SMS body</label><textarea id="missed_call_sms_body"></textarea></div><div class="field"><label>After-hours SMS body</label><textarea id="after_hours_sms_body"></textarea></div><button class="btn primary" onclick="saveSettings()">Save settings</button><div class="field"><h3>Greeting management</h3><label>Greeting name</label><input id="greeting_name" placeholder="Main voicemail greeting"><label>Greeting type</label><select id="greeting_type"><option value="standard">Standard greeting</option><option value="upload">Upload greeting</option><option value="recorded">Record in browser</option><option value="text_to_speech">AI voice from text</option></select><label>Greeting text</label><textarea id="greeting_text" placeholder="Type the voicemail greeting or AI voice script"></textarea><button class="btn" onclick="previewGreeting()">Preview Greeting</button><button class="btn primary" onclick="saveGreeting()">Set Active Greeting</button></div>
  </div>
  <div class="tabs" id="tabs"><button class="tab active" data-tab="all">All</button><button class="tab" data-tab="missed">Missed</button><button class="tab" data-tab="voicemail">Voicemails</button><button class="tab" data-tab="recordings">Call Recordings</button><button class="tab" data-tab="forwarded">Forwarded</button></div><div id="list"></div>
</div>
<div id="incoming" class="incoming"><div class="small" id="incomingMode">Incoming call</div><h2 id="incomingName">Unknown caller</h2><div class="num" id="incomingNumber"></div><div class="call-controls"><button class="round accept" onclick="acceptIncoming()">☎</button><button class="round mute" onclick="toggleMute()">M</button><button class="round vm" onclick="sendIncomingToVoicemail()">VM</button><button class="round decline" onclick="declineIncoming()">✕</button></div></div>
<div class="bottom"><a class="nav" href="/app/inbox">☆<span>Favorites</span></a><a class="nav active" href="/app/calls">◷<span>Recents</span></a><a class="nav" href="/app/inbox?contacts=1">◎<span>Contacts</span></a><a class="nav" href="/app/calls?tab=keypad">▦<span>Keypad</span></a><a class="nav" href="/app/calls/settings" onclick="setTimeout(toggleSettings,0)">⚙<span>Settings</span></a></div>
<script>
let active='all', voiceDevice=null, pendingCall=null, activeCall=null, pendingCallLogId=null, muted=false;
const qs=(id)=>document.getElementById(id);function state(msg,cls=''){voiceState.textContent=msg;voiceState.className='voice-state '+cls}function fmtDur(s){s=Number(s||0);return s?`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`:'—'}function icon(c){if(c.status==='missed'||c.status==='no-answer'||c.status==='declined')return'↙';if(c.status==='voicemail')return'🎙';if(c.status==='forwarded'||c.forwarded_to_number)return'↪';return c.direction==='outbound'?'↗':'↘'}
function callIdFromInvite(call){try{return call?.customParameters?.get('call_log_id')||call?.parameters?.call_log_id||pendingCallLogId}catch(e){return pendingCallLogId}}
function playVoicemail(id){let audio=qs(`vm-${id}`);if(audio){audio.paused?audio.play():audio.pause()}}
function render(calls){list.innerHTML=calls.length?'':'<div class="empty">No calls yet.</div>';calls.forEach(c=>{let b=(c.status||'').replace('no-answer','missed');let el=document.createElement('div');el.className='card pwa-card';el.innerHTML=`<div class="row"><div class="avatar">${icon(c)}</div><div class="meta"><div class="name">${c.caller_name||c.from_number||'Unknown'}</div><div class="num">${c.from_number||''} → ${c.to_number||''}</div><div class="small">${new Date(c.created_at).toLocaleString()} · ${fmtDur(c.duration_seconds)} ${c.forwarded_to_number?'· fwd '+c.forwarded_to_number:''}${c.answered_by_user_id?' · answered by user '+c.answered_by_user_id:''}</div></div><span class="badge ${b}">${b||'ringing'}</span></div>${c.transcription_text?`<div class="transcript">${c.transcription_text.slice(0,180)}</div>`:''}<div class="actions"><a class="btn primary" href="tel:${c.from_number||''}">Call back</a><a class="btn" href="sms:${c.from_number||''}">Message</a>${c.voicemail_exists?`<button class="btn primary" onclick="playVoicemail(${c.id})">Play Voicemail</button><button class="btn" onclick="alert(c.transcription_text||'No transcription yet')">Transcription</button><a class="btn" href="/api/calls/${c.id}/voicemail/audio" download>Download</a><audio id="vm-${c.id}" class="voicemail-player" preload="none" controls src="/api/calls/${c.id}/voicemail/audio"></audio>`:''}${c.recording_url&&!c.voicemail_exists?`<a class="btn" href="${c.recording_url}" target="_blank">Call Recording</a>`:''}<button class="btn" onclick="archiveCall(${c.id})">Archive</button></div>`;list.appendChild(el)})}
async function load(){let r=await fetch('/api/calls/recent?tab='+active);render((await r.json()).calls||[])}tabs.onclick=e=>{if(e.target.dataset.tab){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));e.target.classList.add('active');active=e.target.dataset.tab;load()}};async function archiveCall(id){await fetch(`/api/calls/${id}/archive`,{method:'POST'});load()}function toggleSettings(){settings.classList.toggle('show')}
function previewGreeting(){alert((qs('greeting_text')?.value)||'Standard voicemail greeting preview')}async function saveGreeting(){let nums=await(await fetch('/api/phone/numbers')).json();let n=(nums.numbers||[])[0];if(!n||!n.id){alert('Select a phone number in Settings before saving a greeting.');return}let body={name:qs('greeting_name').value||'Voicemail greeting',greeting_type:qs('greeting_type').value,text_body:qs('greeting_text').value,is_active:true};await fetch(`/api/phone/numbers/${n.id}/greetings`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});alert('Greeting saved')}async function loadSettings(){let s=(await(await fetch('/api/phone/settings')).json()).settings||{};Object.keys(s).forEach(k=>{let el=qs(k);if(!el)return;if(el.type==='checkbox')el.checked=!!s[k];else el.value=s[k]||''})}async function saveSettings(){let data={};document.querySelectorAll('#settings input,#settings textarea,#settings select').forEach(el=>data[el.id]=el.type==='checkbox'?el.checked:el.value);await fetch('/api/phone/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});alert('Saved')}
function showIncoming(d,call=null){pendingCall=call||pendingCall;pendingCallLogId=d.call_id||callIdFromInvite(call);incomingMode.textContent=call?'Incoming browser call':'Incoming call';incomingName.textContent=d.caller_name||d.from_number||'Unknown caller';incomingNumber.textContent=d.from_number||'';incoming.classList.add('show');load()}function hideIncoming(){incoming.classList.remove('show')}async function markCall(action){let id=callIdFromInvite(pendingCall||activeCall);if(id)await fetch(`/api/calls/${id}/${action}`,{method:'POST'}).catch(()=>{});load()}
async function acceptIncoming(){try{if(pendingCall){activeCall=pendingCall;await pendingCall.accept();pendingCall=null;await markCall('accept');state('Call connected','ok')}hideIncoming()}catch(e){state('Could not answer: '+e.message,'error')}}async function declineIncoming(){try{if(pendingCall){pendingCall.reject();await markCall('decline')}else await markCall('decline')}finally{pendingCall=null;hideIncoming();state('Call declined')}}async function sendIncomingToVoicemail(){try{if(pendingCall)pendingCall.reject();await markCall('voicemail')}finally{pendingCall=null;hideIncoming();state('Sent to voicemail')}}async function endCall(){if(activeCall){activeCall.disconnect();await markCall('end');activeCall=null;state('Call ended')}}function toggleMute(){muted=!muted;if(activeCall&&activeCall.mute)activeCall.mute(muted);state(muted?'Muted':'Unmuted')}
function voiceSdkCtor(){return window.Twilio?.Device||window.Twilio?.Voice?.Device||null}
function voiceError(code,msg,detail){console.error('Browser voice setup failed',code,detail||msg);try{fetch('/api/phone/voice-client-error',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,message:msg,detail:detail?.message||String(detail||'')})})}catch(e){}state(msg,'error')}
async function ensureMicReady(){if(!navigator.mediaDevices?.getUserMedia)throw Object.assign(new Error('WebRTC microphone capture is not supported in this browser.'),{voiceCode:'WEBRTC_UNSUPPORTED'});try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(t=>t.stop())}catch(e){throw Object.assign(e,{voiceCode:e.name==='NotAllowedError'||e.name==='SecurityError'?'MICROPHONE_BLOCKED':'MICROPHONE_FAILED'})}}
async function readVoiceToken(){let res=await fetch('/api/phone/voice-token',{headers:{'Accept':'application/json'}});let ct=res.headers.get('content-type')||'';if(!ct.includes('application/json'))throw Object.assign(new Error(`Voice token endpoint returned ${res.status} ${ct||'non-JSON response'}.`),{voiceCode:'TOKEN_ENDPOINT_FAILED'});let body=await res.json();if(!res.ok||!body.success){let err=new Error(body.error||`Voice token endpoint failed (${res.status}).`);err.voiceCode=body.code||'TOKEN_ENDPOINT_FAILED';throw err}return body}
async function initVoice(){try{let Device=voiceSdkCtor();if(!Device){voiceError('SDK_MISSING','Calling SDK failed to load. Refresh the page or check your network connection.');return}if(location.protocol!=='https:'&&!['localhost','127.0.0.1'].includes(location.hostname)){voiceError('HTTPS_REQUIRED','Browser calling requires HTTPS.');return}let body=await readVoiceToken();if(!body.calling_number){voiceError('NO_ASSIGNED_NUMBER','No calling number assigned');return}await ensureMicReady();if(voiceDevice?.unregister)try{voiceDevice.unregister()}catch(e){}voiceDevice=new Device(body.token,{logLevel:1,codecPreferences:['opus','pcmu']});voiceDevice.on('registered',()=>state(`Browser phone registered for ${body.calling_number}`,'ok'));voiceDevice.on('unregistered',()=>state('Browser phone unregistered'));voiceDevice.on('error',e=>voiceError('TWILIO_REGISTRATION_FAILED','Twilio registration failed: '+(e.message||'Unknown error'),e));voiceDevice.on('incoming',call=>{let params=call.customParameters;showIncoming({call_id:params?.get('call_log_id'),from_number:params?.get('from_number'),caller_name:params?.get('caller_name')},call)});voiceDevice.on('tokenWillExpire',async()=>{try{let fresh=await readVoiceToken();await voiceDevice.updateToken(fresh.token)}catch(e){voiceError(e.voiceCode||'TOKEN_ENDPOINT_FAILED','Could not refresh voice token: '+e.message,e)}});state('Registering browser phone…');await voiceDevice.register()}catch(e){let code=e.voiceCode||'TWILIO_REGISTRATION_FAILED';let messages={SDK_MISSING:'Calling SDK failed to load. Refresh the page or check your network connection.',TOKEN_ENDPOINT_FAILED:'Could not reach the voice token endpoint. Please sign in again or contact support.',MICROPHONE_BLOCKED:'Microphone permission is blocked. Allow microphone access to use browser calling.',MICROPHONE_FAILED:'Microphone is unavailable. Check your browser audio settings.',WEBRTC_UNSUPPORTED:'WebRTC calling is not supported in this browser.',NO_ASSIGNED_NUMBER:'No calling number assigned',TWILIO_REGISTRATION_FAILED:'Twilio registration failed: '+e.message};voiceError(code,messages[code]||('Voice setup failed: '+e.message),e)}}window.addEventListener('beforeunload',()=>{try{voiceDevice?.unregister()}catch(e){}});
try{let es=new EventSource('/api/inbox/stream');es.onmessage=e=>{let d=JSON.parse(e.data);if(d.type==='incoming_call')showIncoming(d)}}catch(e){}window.addEventListener('load',()=>setTimeout(initVoice,200));load();loadSettings();if(location.pathname.endsWith('/settings'))settings.classList.add('show');
</script>
</body>
</html>
