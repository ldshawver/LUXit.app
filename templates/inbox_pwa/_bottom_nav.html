<style>
  .pwa-bottom-nav {
    position: fixed;
    left: max(12px, env(safe-area-inset-left));
    right: max(12px, env(safe-area-inset-right));
    bottom: calc(10px + env(safe-area-inset-bottom));
    z-index: 60;
    max-width: 620px;
    margin: 0 auto;
    padding: 8px;
    border: 1px solid var(--pwa-border, var(--color-border, #273044));
    border-radius: 26px;
    background: color-mix(in srgb, var(--pwa-bg, var(--color-background, #060712)) 90%, transparent);
    box-shadow: 0 18px 55px rgba(0, 0, 0, .38);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(44px, 1fr);
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .pwa-bottom-nav::-webkit-scrollbar { display: none; }
  .pwa-bottom-nav__item {
    min-width: 44px;
    min-height: 48px;
    border-radius: 18px;
    color: var(--pwa-muted, var(--color-muted-text, #94a3b8));
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: background .15s ease, color .15s ease, transform .15s ease;
  }
  .pwa-bottom-nav__item svg {
    width: 22px;
    height: 22px;
    stroke-width: 2;
    color: currentColor;
  }
  .pwa-bottom-nav__label {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .pwa-bottom-nav__item:hover,
  .pwa-bottom-nav__item:focus-visible,
  .pwa-bottom-nav__item.is-active {
    background: var(--pwa-primary-soft, color-mix(in srgb, var(--pwa-primary, var(--color-primary, #8b5cf6)) 22%, transparent));
    color: var(--pwa-primary-contrast, var(--color-button-text, #fff));
    outline: none;
  }
  .pwa-bottom-nav__item:active { transform: scale(.96); }
  body.has-pwa-bottom-nav #shell { bottom: calc(76px + env(safe-area-inset-bottom)); height: auto; }
  body.has-pwa-bottom-nav .shell { padding-bottom: calc(112px + env(safe-area-inset-bottom)); }
</style>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06A2 2 0 1 1 7.04 4.3l.06.06A1.65 1.65 0 0 0 8.92 4a1.65 1.65 0 0 0 1-1.51V2a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 3.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.36.37.56.87.56 1.39V10H21a2 2 0 1 1 0 4h-.09c-.52 0-1.02.2-1.39.56z"/></svg><span class="pwa-bottom-nav__label">Settings</span>
  </a>
</nav>
<script>
(function(){
  document.body.classList.add('has-pwa-bottom-nav');
  const params = new URLSearchParams(location.search);
  let active = 'messages';
  if (location.pathname.startsWith('/app/calls')) active = params.get('tab') === 'voicemail' ? 'voicemail' : 'calls';
  if (params.has('settings') || location.pathname.endsWith('/settings')) active = 'settings';
  if (params.has('keypad')) active = 'keypad';
  if (params.has('compose')) active = 'new-text';
  if (params.has('contacts')) active = 'contacts';
  if (params.has('favorites')) active = 'favorites';
  document.querySelectorAll('.pwa-bottom-nav__item').forEach(item => item.classList.toggle('is-active', item.dataset.pwaNav === active));
})();
</script>
