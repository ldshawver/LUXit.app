{% extends "base.html" %}{% block title %}Global Licenses{% endblock %}{% block content %}<h1>All Tenant Licenses</h1><table class="table"><tr><th>Tenant</th><th>Feature</th><th>Status</th><th>Amount</th><th>Actions</th></tr>{% for l in licenses %}<tr><td>{{ l.company_id }}</td><td>{{ l.feature_key }}</td><td>{{ l.status }}</td><td>{{ l.monthly_price }}</td><td><button class="btn btn-sm btn-warning">Suspend</button><button class="btn btn-sm btn-success">Reactivate</button></td></tr>{% endfor %}</table>{% endblock %}
