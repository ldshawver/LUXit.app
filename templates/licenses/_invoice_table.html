<table class="table"><thead><tr><th>Invoice</th><th>Status</th><th>Due</th><th>Paid</th><th>Links</th></tr></thead><tbody>{% for invoice in invoices %}<tr><td>{{ invoice.invoice_number or invoice.id }}</td><td>{{ invoice.status }}</td><td>{{ invoice.amount_due }}</td><td>{{ invoice.amount_paid }}</td><td>{% if invoice.hosted_invoice_url %}<a href="{{ invoice.hosted_invoice_url }}">View</a>{% endif %} {% if invoice.invoice_pdf %}<a href="{{ invoice.invoice_pdf }}">PDF</a>{% endif %}</td></tr>{% else %}<tr><td colspan="5">No invoices yet.</td></tr>{% endfor %}</tbody></table>
