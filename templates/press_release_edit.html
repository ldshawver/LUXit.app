{% extends "base.html" %}
{% block title %}Edit: {{ pr.title }} - LUX IT{% endblock %}
{% block content %}
<div class="container mt-4">
    <a href="{{ url_for('main.press_releases_list') }}" class="text-muted text-decoration-none mb-3 d-inline-block">
        <i data-feather="arrow-left" style="width:16px;height:16px;"></i> Back to Press Releases
    </a>
    <h2>Edit Press Release</h2>

    <div class="card bg-dark border-secondary mt-3">
        <div class="card-body">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input type="text" name="title" class="form-control" value="{{ pr.title }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Subtitle</label>
                    <input type="text" name="subtitle" class="form-control" value="{{ pr.subtitle or '' }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Content</label>
                    <textarea name="content" class="form-control" rows="10" required>{{ pr.content or '' }}</textarea>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Release Date</label>
                        <input type="date" name="release_date" class="form-control" value="{{ pr.release_date.isoformat() if pr.release_date else '' }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Embargo Until</label>
                        <input type="datetime-local" name="embargo_until" class="form-control" value="{{ pr.embargo_until.strftime('%Y-%m-%dT%H:%M') if pr.embargo_until else '' }}">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contact Info</label>
                    <textarea name="contact_info" class="form-control" rows="2">{{ pr.contact_info or '' }}</textarea>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" name="action" value="save" class="btn btn-primary">Save Changes</button>
                    <button type="submit" name="action" value="publish" class="btn btn-success">Publish</button>
                    <a href="{{ url_for('main.press_releases_list') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
