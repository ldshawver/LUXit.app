<div style="font-family:Arial,Helvetica,sans-serif;max-width:520px;margin:0 auto;color:#1f2937;">
  <h2 style="margin:0 0 16px;">You already have a LUXit account</h2>
  <p>Hi {{ user.first_name or user.username }},</p>
  <p>Someone tried to create a new LUXit account with this email address. You already have one, so nothing was changed.</p>
  <p style="margin:24px 0;"><a href="{{ login_url }}" style="background:#0e7490;color:#ffffff;padding:12px 20px;border-radius:6px;text-decoration:none;display:inline-block;">Sign in</a></p>
  <p style="font-size:13px;color:#6b7280;">Forgot your password? <a href="{{ reset_url }}">Reset it here</a>. If this wasn't you, you can ignore this email.</p>
</div>
