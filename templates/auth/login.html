<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login • LUX IT</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(circle at top, rgba(71, 245, 255, 0.14), transparent 40%),
          radial-gradient(circle at 20% 20%, rgba(255, 79, 216, 0.18), transparent 45%),
          #0b0b0f url("/static/img/login-bg.svg") center/cover no-repeat;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
      }
      .login-card {
        width: min(420px, 100%);
        background: rgba(12, 14, 20, 0.94);
        border: 1px solid var(--lux-border-strong);
        border-radius: 16px;
        padding: 32px;
        box-shadow: var(--lux-shadow), 0 0 32px rgba(71, 245, 255, 0.25);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        position: relative;
      }
      .login-card::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        border: 1px solid rgba(255, 255, 255, 0.12);
        pointer-events: none;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.8rem;
      }
      p {
        margin: 0 0 24px;
        color: #b6b9c5;
        font-size: 0.95rem;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.85rem;
        color: #e5e7ef;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(15, 18, 28, 0.9);
        color: #f1f1f5;
        margin-bottom: 16px;
      }
      button {
        width: 100%;
        padding: 12px 16px;
        border-radius: 10px;
        border: none;
        background: linear-gradient(120deg, #7c3aed, #4f46e5);
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      .flash {
        margin-bottom: 16px;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 0.85rem;
      }
      .flash.error {
        background: rgba(239, 68, 68, 0.15);
        color: #fca5a5;
      }
      .flash.success {
        background: rgba(34, 197, 94, 0.15);
        color: #86efac;
      }
      @media (max-width: 480px) {
        .login-card {
          padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div style="text-align: center; margin-bottom: 24px;">
        <a href="/" style="display: inline-flex; align-items: center; gap: 4px; text-decoration: none;">
          <img src="{{ url_for('static', filename='images/lux-chrome.png') }}" alt="LUX" style="height: 38px; mix-blend-mode: screen;">
          <span style="display: flex; flex-direction: column; align-items: flex-start; height: 38px; justify-content: center; margin-left: 2px;">
            <span style="color: #00e5ff; font-size: 1.2rem; font-weight: 800; line-height: 1;">IT</span>
            <span style="color: #a855f7; font-size: 0.85rem; font-weight: 600; line-height: 1;">.app</span>
          </span>
        </a>
      </div>
      <h1>Welcome back</h1>
      <p>Log in to your LUX IT dashboard.</p>

      {% with messages = get_flashed_messages(with_categories=True) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="username">Username or Email</label>
        <input id="username" name="username" type="text" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Sign in</button>
      </form>
      <div style="text-align:center;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:0;flex-wrap:wrap;">
        <a href="{{ url_for('auth.forgot_password') }}" style="font-size:0.83rem;color:#6b7280;text-decoration:none;" onmouseover="this.style.color='#00e5ff'" onmouseout="this.style.color='#6b7280'">Forgot password?</a>
        <span style="color:#374151;margin:0 10px;">·</span>
        <a href="{{ url_for('auth.forgot_username') }}" style="font-size:0.83rem;color:#6b7280;text-decoration:none;" onmouseover="this.style.color='#00e5ff'" onmouseout="this.style.color='#6b7280'">Forgot username?</a>
      </div>
    </div>
    <div class="ambient-particles" id="ambientParticles" style="position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;"></div>
    <script>
    (function(){
      var c=document.getElementById('ambientParticles');
      if(!c)return;
      var colors=['#a855f7','#47f5ff','#00ffb4','#7c3aed','#c0c8d8','#e879f9','#22d3ee'];
      var count=60;
      var css=document.createElement('style');
      css.textContent='@keyframes floatUp{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.8}90%{opacity:.6}100%{transform:translateY(-110vh) translateX(var(--drift));opacity:0}}.ambient-particles .p{position:absolute;bottom:-10px;border-radius:50%;opacity:0;animation:floatUp linear infinite}';
      document.head.appendChild(css);
      for(var i=0;i<count;i++){
        var d=document.createElement('div');
        d.className='p';
        var size=Math.random()*4+2;
        var dur=Math.random()*12+8;
        var delay=Math.random()*15;
        var left=Math.random()*100;
        var driftX=(Math.random()-0.5)*120;
        d.style.cssText='width:'+size+'px;height:'+size+'px;left:'+left+'%;animation-duration:'+dur+'s;animation-delay:'+delay+'s;background:'+colors[i%colors.length]+';box-shadow:0 0 '+(size*2)+'px '+colors[i%colors.length]+';--drift:'+driftX+'px;';
        c.appendChild(d);
      }
    })();
    </script>
  </body>
</html>
