name: Push to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: push-production
  cancel-in-progress: true

jobs:
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: Confirm Tailscale connection
        run: |
          tailscale status
          tailscale ip -4
          ping -c 3 ${{ secrets.HOST }} || true
          timeout 10 bash -c "</dev/tcp/${{ secrets.HOST }}/22" && echo "SSH port reachable" || echo "SSH port unreachable"
      - name: Deploy to Production VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          script_stop: true
          script: |
            set -e

            cd /root/lux-email-bot

            git fetch origin
            git reset --hard origin/main
            git clean -fd

            source .env
            psql "$DATABASE_URL" -c "select now();"

            sudo systemctl daemon-reload
            sudo systemctl reset-failed luxit.service
            sudo systemctl restart luxit.service

            sleep 5
            sudo systemctl status luxit.service --no-pager -l
