name: Push to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: push-production
  cancel-in-progress: true

jobs:
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Probe SSH on public LUXit VPS
        shell: bash
        env:
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${HOST:-}" ]; then
            echo "VPS_HOST secret is required for the public LUXit VPS host." >&2
            exit 1
          fi
          echo "Probing SSH on public LUXit VPS ${HOST}:22..."
          timeout 15 bash -c "</dev/tcp/${HOST}/22"
          echo "Public LUXit VPS SSH port reachable"

      - name: Deploy to Production VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: serveradmin
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script_stop: true
          script: |
            sudo -n true
            sudo bash <<'REMOTE_DEPLOY'
            set -euo pipefail
            APP_DIR="/root/lux-email-bot"
            SERVICE="lux-email-bot.service"
            PORT="8001"

            echo "== Deploying LUXit live app =="
            cd "$APP_DIR"

            echo "== Git update =="
            git fetch origin main
            git reset --hard origin/main

            echo "== Verify env file =="
            test -f .env

            echo "== Load env =="
            set -a
            source .env
            set +a

            echo "== Verify required env =="
            test -n "${DATABASE_URL:-}"

            echo "== Forward-only migrations =="
            test -x scripts/apply_migrations.sh
            scripts/apply_migrations.sh "$DATABASE_URL" migrations

            echo "== Verify required production schema =="
            test -f scripts/verify_production_schema.sql
            psql "$DATABASE_URL" \
              -v ON_ERROR_STOP=1 \
              -f scripts/verify_production_schema.sql

            echo "== Verify CRM schema contract =="
            test -f scripts/verify_crm_schema.py
            if [ -x ".venv/bin/python" ]; then
              .venv/bin/python scripts/verify_crm_schema.py
            else
              python3 scripts/verify_crm_schema.py
            fi

            echo "== Python syntax check =="
            if [ -x ".venv/bin/python" ]; then
              .venv/bin/python -m py_compile app.py auth.py routes.py models.py inbox_pwa.py twilio_sms.py
            else
              python3 -m py_compile app.py auth.py routes.py models.py inbox_pwa.py twilio_sms.py
            fi

            echo "== Restart live service =="
            systemctl daemon-reload
            systemctl reset-failed "$SERVICE" || true
            restart_since="$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
            systemctl restart "$SERVICE"

            echo "== Wait for local app readiness =="
            ready="false"
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${PORT}/healthz" >/dev/null; then
                ready="true"
                break
              fi
              echo "Waiting for app... attempt $i/30"
              sleep 2
            done

            if [ "$ready" != "true" ]; then
              echo "App did not become ready"
              systemctl status "$SERVICE" --no-pager -l || true
              journalctl -u "$SERVICE" -n 160 --no-pager || true
              exit 1
            fi

            echo "== Service status =="
            systemctl status "$SERVICE" --no-pager -l

            echo "== Public smoke test =="
            curl -fsS "https://luxit.app/healthz" >/dev/null

            echo "== Scan recent logs for deploy-breaking errors =="
            recent_logs="$(mktemp)"
            journalctl -u "$SERVICE" --since "$restart_since" --no-pager > "$recent_logs" || true
            if grep -E 'UndefinedColumn|ProgrammingError|BuildError|InFailedSqlTransaction|Traceback' "$recent_logs"; then
              echo "Recent service logs contain deploy-breaking errors" >&2
              cat "$recent_logs" >&2
              exit 1
            fi

            echo "== Recent service logs =="
            cat "$recent_logs"
            rm -f "$recent_logs"
            REMOTE_DEPLOY
