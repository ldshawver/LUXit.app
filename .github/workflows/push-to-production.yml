name: Push to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: push-production
  cancel-in-progress: true

jobs:
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_CLIENTID }}
          oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
          tags: ${{ secrets.TAGS }}

      - name: Show Tailscale Status
        run: |
          tailscale version
          tailscale status || true
          tailscale ip -4 || true

      - name: Test VPS Reachability
        run: |
          echo "Testing Tailscale connectivity to VPS..."
          timeout 20 bash -c "</dev/tcp/${{ secrets.HOST }}/22" \
            && echo "SUCCESS: SSH port reachable" \
            || (echo "FAILED: SSH port not reachable" && exit 1)

      - name: Deploy to Production VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          script_stop: true
          debug: true
          script: |
            set -e

            echo "===== CONNECTED ====="
            whoami
            hostname
            pwd

            echo "===== APP ====="
            cd /root/lux-email-bot

            git status
            git branch
            git rev-parse HEAD

            echo "===== COMPLETE ====="
