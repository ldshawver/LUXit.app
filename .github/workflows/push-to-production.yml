name: Push to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: push-production
  cancel-in-progress: true

jobs:
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Confirm SSH connection
        shell: bash
        run: |
          set -euo pipefail
          HOST_VALUE="${{ secrets.HOST }}"
          echo "HOST starts with: ${HOST_VALUE:0:7}"
          echo "Testing SSH port on HOST..."
          timeout 15 bash -c "</dev/tcp/${HOST_VALUE}/22"
          echo "SSH port reachable"

      - name: Deploy to Production VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="/root/lux-email-bot"
            SERVICE="lux-email-bot.service"
            PORT="8001"

            echo "== Deploying LUXit live app =="
            cd "$APP_DIR"

            echo "== Git update =="
            git fetch origin main
            git reset --hard origin/main

            echo "== Verify env file =="
            test -f .env

            echo "== Load env =="
            set -a
            source .env
            set +a

            echo "== Verify required env =="
            test -n "${DATABASE_URL:-}"

            echo "== Database check =="
            if command -v psql >/dev/null 2>&1; then
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select now();"
            else
              echo "psql not installed on VPS; skipping direct DB check"
            fi

            echo "== Optional migrations =="
            if command -v psql >/dev/null 2>&1 && [ -d migrations ]; then
              for f in migrations/*.sql; do
                if [ -f "$f" ]; then
                  echo "Running migration: $f"
                  psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
                fi
              done
            fi

            echo "== Python syntax check =="
            if [ -x ".venv/bin/python" ]; then
              .venv/bin/python -m py_compile app.py auth.py routes.py models.py inbox_pwa.py twilio_sms.py
            else
              python3 -m py_compile app.py auth.py routes.py models.py inbox_pwa.py twilio_sms.py
            fi

            echo "== Restart LIVE service =="
            systemctl daemon-reload
            systemctl reset-failed "$SERVICE" || true
            systemctl restart "$SERVICE"

            sleep 5

            echo "== Service status =="
            systemctl is-active --quiet "$SERVICE"
            systemctl status "$SERVICE" --no-pager -l

            echo "== Local smoke tests =="
            curl -fsS "http://127.0.0.1:${PORT}/auth/login" >/dev/null

            echo "== Public smoke tests =="
            curl -fsS "https://luxit.app/auth/login" >/dev/null

            echo "== Recent logs =="
            journalctl -u "$SERVICE" -n 80 --no-pager

            echo "== Deploy complete =="
