name: Push to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: push-production
  cancel-in-progress: true

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SELECTED_VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail

            echo "Connected to VPS"
            whoami
            hostname

            DEPLOY_DIR="/root/lux-email-bot"

            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "Missing git repo at $DEPLOY_DIR"
              echo "Available /root directories:"
              ls -la /root
              exit 1
            fi

            cd "$DEPLOY_DIR"

            echo "Current branch/status:"
            git branch --show-current
            git status --short

            echo "Fetching latest main..."
            git fetch origin main

            echo "Resetting server checkout to origin/main..."
            git reset --hard origin/main

            echo "Installing dependencies if package files exist..."
            if [ -f package.json ]; then
              if command -v pnpm >/dev/null 2>&1; then
                pnpm install --frozen-lockfile || pnpm install
                pnpm build || true
              elif command -v npm >/dev/null 2>&1; then
                npm ci || npm install
                npm run build || true
              fi
            fi

            echo "Restarting app if PM2 is installed..."
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart all || pm2 start ecosystem.config.js || true
              pm2 save || true
            fi

            echo "Deployment complete."
