name: Push to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: push-production
  cancel-in-progress: true

jobs:
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Confirm Tailscale connection
        run: |
          set -e
          tailscale status
          tailscale ip -4

          HOST_VALUE="${{ secrets.HOST }}"
          echo "HOST starts with: ${HOST_VALUE:0:7}"
          echo "Testing SSH port on HOST..."
          timeout 10 bash -c "</dev/tcp/${HOST_VALUE}/22" && echo "SSH port reachable"

      - name: Deploy to Production VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 5m
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="/root/lux-email-bot"
            SERVICE="lux-email-bot.service"
            PORT="8001"

            echo "== Deploying LUXit live app =="
            cd "$APP_DIR"

            echo "== Git update =="
            git fetch origin
            git reset --hard origin/main
            git clean -fd

            echo "== Load env =="
            set -a
            source .env
            set +a

            echo "== Database check =="
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select now();"

            echo "== Optional migrations =="
            if [ -d migrations ]; then
              for f in migrations/*.sql; do
                if [ -f "$f" ]; then
                  echo "Running migration: $f"
                  psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
                fi
              done
            fi

            echo "== Python syntax check =="
            if [ -x ".venv/bin/python" ]; then
              .venv/bin/python -m py_compile app.py auth.py routes.py models.py inbox_pwa.py twilio_sms.py || true
            fi

            echo "== Restart LIVE service =="
            sudo systemctl daemon-reload
            sudo systemctl reset-failed "$SERVICE" || true
            sudo systemctl restart "$SERVICE"

            sleep 3

            echo "== Service status =="
            sudo systemctl is-active --quiet "$SERVICE"
            sudo systemctl status "$SERVICE" --no-pager -l

            echo "== Local smoke tests =="
            curl -fsS "http://127.0.0.1:${PORT}/auth/login" >/dev/null
            curl -fsSI "http://127.0.0.1:${PORT}/app/inbox" >/dev/null || true
            curl -fsSI "http://127.0.0.1:${PORT}/admin/communications" >/dev/null || true
            curl -fsSI "http://127.0.0.1:${PORT}/app/sms-campaigns" >/dev/null || true
            curl -fsSI "http://127.0.0.1:${PORT}/sms/create" >/dev/null || true

            echo "== Public smoke tests =="
            curl -fsSI "https://luxit.app/auth/login" >/dev/null
            curl -fsSI "https://luxit.app/app/inbox" >/dev/null || true

            echo "== Recent logs =="
            sudo journalctl -u "$SERVICE" -n 80 --no-pager

            echo "== Deploy complete =="
