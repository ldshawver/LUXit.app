name: Push to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: push-production
  cancel-in-progress: true

jobs:
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_CLIENTID }}
          oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
          tags: ${{ secrets.TAGS }}

      - name: Show Tailscale Status
        run: |
          tailscale version
          tailscale status
          tailscale ip -4

      - name: Test VPS Reachability
        run: |
          timeout 20 bash -c "</dev/tcp/${{ secrets.HOST }}/22" \
            && echo "SUCCESS: SSH port reachable" \
            || (echo "FAILED: SSH port not reachable" && exit 1)

      - name: Prepare SSH Key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_PRIVATE_KEY }}" > ~/.ssh/luxit_vps_key
          chmod 600 ~/.ssh/luxit_vps_key
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to Production VPS
        run: |
          ssh -i ~/.ssh/luxit_vps_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            root@${{ secrets.HOST }} << 'EOF'
              set -e

              echo "===== CONNECTED ====="
              whoami
              hostname
              pwd

              echo "===== APP ====="
              cd /root/lux-email-bot

              git status
              git branch
              git rev-parse HEAD

              echo "===== COMPLETE ====="
          EOF
