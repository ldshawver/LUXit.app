name: Deploy LUXit to VPS

on:
  workflow_dispatch:

jobs:
  deploy-to-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 194.195.92.52
          username: root
          key: ${{ secrets.VPS_LUXIT }}
          port: 2222
          timeout: 120s
          command_timeout: 20m
          debug: true
          script_stop: true
          script: |
            set -euo pipefail

            echo "CONNECTED"
            whoami
            hostname
            date

            APP_DIR="/root/lux-email-bot"
            SERVICE_NAME="lux-email-bot"

            cd "$APP_DIR"

            git config --global --add safe.directory "$APP_DIR"

            echo "Checking repo status..."
            git remote -v
            git status --short || true

            echo "Backing up SQLite database if present..."
            mkdir -p backups
            if [ -f email_marketing.db ]; then
              cp email_marketing.db "backups/email_marketing_$(date +%F_%H%M%S).db"
            fi

            echo "Pulling latest from GitHub..."
            git fetch origin main
            git reset --hard origin/main

            echo "Cleaning code directory while preserving runtime data..."
            git clean -fd \
              -e .env \
              -e "*.db" \
              -e "instance/" \
              -e "backups/" \
              -e "uploads/" \
              -e "logs/" \
              -e ".venv/"

            echo "Preparing Python environment..."
            if [ ! -d ".venv" ]; then
              python3 -m venv .venv
            fi

            source .venv/bin/activate
            python -m pip install --upgrade pip setuptools wheel

            if [ -f requirements.txt ]; then
              pip install -r requirements.txt --upgrade
            else
              echo "ERROR: requirements.txt not found"
              exit 1
            fi

            echo "Running migrations if migration script exists..."
            if [ -f scripts/migrate_db.py ]; then
              python scripts/migrate_db.py
            else
              echo "No scripts/migrate_db.py found, skipping migration."
            fi

            echo "Compiling Python files..."
            python -m compileall -q .

            echo "Restarting service..."
            systemctl restart "$SERVICE_NAME"

            echo "Waiting for service..."
            sleep 5

            echo "Checking service status..."
            systemctl is-active --quiet "$SERVICE_NAME"
            systemctl status "$SERVICE_NAME" --no-pager -l | head -80

            echo "Checking endpoints..."
            curl -fsSIL https://luxit.app/app/inbox | grep -E "^HTTP|Location" || true
            curl -fsSIL https://luxit.app/twilio/settings | grep -E "^HTTP|Location" || true

            echo "DEPLOY COMPLETE"
