name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /var/www/luxit
            echo "=== Pulling latest code ==="
            git fetch origin main
            git reset --hard origin/main
            echo "=== Fixing psycopg for Python 3.13 ==="
            sed -i 's/psycopg2-binary.*/psycopg[binary]==3.2.4/' requirements.txt
            echo "=== Activating venv ==="
            source venv/bin/activate
            echo "=== Uninstalling old psycopg2 ==="
            pip uninstall -y psycopg2-binary 2>/dev/null || true
            echo "=== Installing dependencies ==="
            pip install -r requirements.txt
            echo "=== Restarting service ==="
            sudo systemctl restart luxit
            sleep 5
            echo "=== Checking status ==="
            sudo systemctl is-active luxit
            echo "=== Deployment complete! ==="
