name: Deploy Production VPS

on:
  workflow_dispatch:
  # Uncomment only after a successful manual deploy:
  # push:
  #   branches:
  #     - main

jobs:
  deploy-production:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 60s
          command_timeout: 10m
          debug: true
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="/root/lux-email-bot"

            echo "=== Connected to VPS ==="
            whoami
            hostname
            date

            cd "$APP_DIR"

            git config --global --add safe.directory "$APP_DIR"

            echo "=== Backup DB ==="
            mkdir -p backups
            cp email_marketing.db backups/email_marketing_$(date +%F_%H%M%S).db 2>/dev/null || true

            echo "=== Sync code from GitHub ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Clean safely (preserve runtime data) ==="
            git clean -fd \
              -e .env \
              -e "*.db" \
              -e "instance/" \
              -e "backups/" \
              -e "uploads/" \
              -e "logs/"

            echo "=== Activate venv ==="
            source .venv/bin/activate

            echo "=== Install deps ==="
            python -m pip install --upgrade pip
            pip install -r requirements.txt --upgrade

            echo "=== Run migrations ==="
            python scripts/migrate_db.py

            echo "=== Compile key files ==="
            python -m py_compile app.py models.py auth.py twilio_sms.py inbox_pwa.py

            echo "=== Restart app ==="
            systemctl restart lux-email-bot
            sleep 4

            echo "=== Verify service ==="
            systemctl is-active lux-email-bot
            systemctl status lux-email-bot --no-pager | head -25

            echo "=== Verify routes ==="
            curl -sI https://luxit.app/ | head -5
            curl -sI https://luxit.app/app/inbox | grep -E "^HTTP|Location" || true
            curl -sI https://luxit.app/twilio/settings | grep -E "^HTTP|Location" || true

            echo "=== Production deploy complete ==="
